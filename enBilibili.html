<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>EnBilibili.3</title>
    <style>
        *,*::before,*::after {
            box-sizing: border-box;
        }
        body {
            touch-action: manipulation;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            padding: 0 8px;
            margin: 0;
            background: #f9f9f9;
            width:100%;
        }
        #globe-container{
            width:100%;
            margin: 0 auto;
            max-width: 1200px;
        }
        #video-container {
            width:100%;
            aspect-ratio: 16 / 9;
            margin: auto;
        }
        iframe {
            width: 100%;
            height:100%;
            border: none;
        }
        #subtitle {
            margin: 5px auto;
            width: 100%;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            padding: 5px;
            background: #b7d6ea;
            border-radius: 5px;
            line-height: 20px;
            color: #111;
        }
        #info-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 5px auto;
            height: 40px;
            border-radius: 5px;
            background: #d3d3d3;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn {
            display: block;
            width: 100%;
            margin: 10px auto 0 auto;
            height: 60px;
            line-height:60px;
            border: 1px solid #9c9c9c;
            border-radius: 5px;
            background: #d3d3d3;
            color: #222;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn:hover {
            background: #c5c5c5;
        }
        .highlight {
            color: #000;
            font-weight: bold;
        }
        .next {}
    </style>
</head>
<body>
<div id="globe-container">
    <div id="video-container">
        <div id="player"></div>
    </div>

    <div id="subtitle"></div>
    <div id="info-box">--/--</div>

    <div>
        <button class="btn" onclick="random()">Random</button>
        <button class="btn" onclick="stop()">Reset</button>
        <button class="btn" onclick="toggleSubtitle()">Show</button>
    </div>
</div>

<script>

    let data = [];
    let currentSub = null;
    let currentIndex = -1;
    let preCnt = 1;
    let nextCnt = 5;

    function encodeHTML(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    async function loadData() {
        const response = await fetch("enBilibili/subs.json");
        let raw = await response.json();

        // 🔥 过滤掉空白字幕片段 + 缺少起止时间的片段
        data = raw.map(video => {
            return {
                id: video.id,
                events: video.events.map(ev => ({
                    tStartMs: ev.from * 1000,
                    dDurationMs: (ev.to - ev.from) * 1000,
                    segs: [{ utf8: ev.content }]
                })).filter(ev => {
                    if (!ev || !ev.segs) return false;
                    if (ev.tStartMs == null || ev.dDurationMs == null) return false; // 没有时间的剔除
                    const text = ev.segs.map(s => (s && s.utf8 ? s.utf8.trim() : "")).join(" ");
                    return text.length > 0;
                })
            };
        }).filter(v => v.events.length > 0);

        random();
    }


    function joinSegs(ev) {
        if (!ev || !ev.segs) return "";
        return ev.segs.map(s => (s && s.utf8 ? s.utf8.trim() : ""))
            .filter(Boolean)
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();
    }

    function pickRandom() {
        if (!data || data.length === 0) return null;
        const video = data[Math.floor(Math.random() * data.length)];
        if (!video || !video.events || video.events.length === 0) return null;
        currentIndex = Math.floor(Math.random() * video.events.length);
        const event = video.events[currentIndex];
        if (!event || !event.segs || event.segs.length === 0) return pickRandom();

        const events = [];
        for(let i = preCnt; i >0 ; i--) {
            let idx = currentIndex-i;
            if(idx >= 0){
                events.push(video.events[idx]);
            }
        }
        events.push(event);
        for(let i = 1; i <= nextCnt; i++) {
            let idx = currentIndex+i;
            if(idx < video.events.length){
                events.push(video.events[idx]);
            }
        }

        return {
            id: video.id,
            s: (event.tStartMs || 0) / 1000,
            e: (event.tStartMs + (event.dDurationMs || 0)) / 1000,
            texts: events.map(evt=> joinSegs(evt)),
            idx: currentIndex + 1
        };
    }

    function random() {
        currentSub = pickRandom();
        if (!currentSub) return;
        iframeReset();

        updateSubtitle(false);
        updateInfo();
    }

    function iframeReset(){
        if (!currentSub) return;

        const playerContainer = document.getElementById("player");

         // 🔥 关键：使用 platform=web 和 iframe 参数强制桌面播放器
        const embedUrl = `https://player.bilibili.com/player.html?bvid=${currentSub.id}&t=${currentSub.s}&autoplay=0&danmaku=0&high_quality=1&platform=web&player_type=html5&disable_webpage=1`;

        playerContainer.innerHTML = `
            <iframe
                src="${embedUrl}"
                scrolling="no"
                border="0"
                frameborder="no"
                framespacing="0"
                allow="encrypted-media"
                style="width:100%;height:100%;"
                referrerpolicy="no-referrer"
                loading="eager">
            </iframe>
        `;

    }

    function stop() {
        if (!currentSub) return;
        iframeReset();
    }

    function updateSubtitle(subtitleVisible) {
        const el = document.getElementById("subtitle");
        if (subtitleVisible && currentSub) {
            let html = "";
            for(let i =0 ;i<currentSub.texts.length;i++){
                const text = currentSub.texts[i];
                if(i == preCnt){
                    html += `<span class="highlight">${encodeHTML(text)}</span>`;
                }else{
                    html += `<span>${encodeHTML(text)}</span> `;
                }
            }
            el.innerHTML = html;
            el.scrollTop = 0;
        } else {
            el.innerHTML = "";
        }
    }

    function updateInfo() {
        const el = document.getElementById("info-box");
        if (currentSub) el.textContent = `${currentSub.idx}/${currentSub.id}`;
        else el.textContent = "--/--";
    }

    function toggleSubtitle() {
        updateSubtitle(true);
    }

    loadData();
</script>
</body>
</html>
